203.0.113.12 - - [19/Nov/2026:09:00:00 +0000] "GET / HTTP/1.1" 200 3000
203.0.113.12 - - [19/Nov/2026:09:00:02 +0000] "POST /login HTTP/1.1" 401 120
203.0.113.12 - - [19/Nov/2026:09:00:03 +0000] "POST /login HTTP/1.1" 401 120
192.0.2.44 - - [19/Nov/2026:09:00:05 +0000] "GET /missing.png HTTP/1.1" 404 0
192.0.2.44 - - [19/Nov/2026:09:00:06 +0000] "GET /private/ HTTP/1.1" 403 199
