198.51.100.61 - - [19/Nov/2026:09:30:01 +0000] "GET /backup.zip HTTP/1.1" 404 0
198.51.100.61 - - [19/Nov/2026:09:30:02 +0000] "GET /server-status HTTP/1.1" 403 199
