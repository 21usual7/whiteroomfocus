[[item]]
id = "web-t3"
objective = "web"
role = "test7"
kind = "text"
prompt = "Какой приём атаки виден во второй строке? (%2f — закодированный «/»)"
code = """
192.0.2.70 - - [19/Nov/2026:10:00:00 +0000] "GET /img?name=logo.png HTTP/1.1" 200 1500
192.0.2.70 - - [19/Nov/2026:10:00:04 +0000] "GET /img?name=..%2f..%2f..%2fetc%2fshadow HTTP/1.1" 400 0
"""
answer = ["обход каталогов", "path traversal", "directory traversal"]
hint = "Раскодируй %2f и посмотри, куда ведёт путь."
explain = "..%2f — это ../ в URL-кодировке: попытка выйти к /etc/shadow, обход каталогов."
