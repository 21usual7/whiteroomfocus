# ───────────── web ─────────────

[[item]]
id = "web-p1"
objective = "web"
role = "practice"
kind = "number"
prompt = "Сколько запросов закончились ошибкой клиента (коды 4xx)?"
code = """
192.0.2.10 - - [18/Nov/2026:10:00:01 +0000] "GET /index.html HTTP/1.1" 200 5120
192.0.2.10 - - [18/Nov/2026:10:00:02 +0000] "GET /favicon.ico HTTP/1.1" 404 0
198.51.100.5 - - [18/Nov/2026:10:00:03 +0000] "GET /admin HTTP/1.1" 403 199
198.51.100.5 - - [18/Nov/2026:10:00:04 +0000] "GET /.env HTTP/1.1" 404 0
"""
answer = ["3"]
hint = "Код ответа — число сразу после кавычек с запросом."
explain = "404, 403, 404 — три ошибки клиента; 200 — успех."

[[item]]
id = "web-p2"
objective = "web"
role = "practice"
kind = "text"
prompt = "С какого адреса сканируют служебные пути?"
code = """
192.0.2.33 - - [18/Nov/2026:10:05:00 +0000] "GET /blog/post-1 HTTP/1.1" 200 8000
203.0.113.8 - - [18/Nov/2026:10:05:01 +0000] "GET /wp-login.php HTTP/1.1" 404 0
203.0.113.8 - - [18/Nov/2026:10:05:01 +0000] "GET /phpmyadmin/ HTTP/1.1" 404 0
203.0.113.8 - - [18/Nov/2026:10:05:02 +0000] "GET /.git/config HTTP/1.1" 404 0
"""
answer = ["203.0.113.8"]
hint = "Ищи частые запросы к несуществующим административным путям."
explain = "203.0.113.8 за секунду пробует /wp-login.php, /phpmyadmin/, /.git/config — автоматический сканер."

[[item]]
id = "web-p3"
objective = "web"
role = "practice"
kind = "text"
prompt = "Какой приём атаки виден во второй строке?"
code = """
192.0.2.21 - - [18/Nov/2026:10:10:00 +0000] "GET /download?file=report.pdf HTTP/1.1" 200 40211
192.0.2.21 - - [18/Nov/2026:10:10:03 +0000] "GET /download?file=../../../../etc/passwd HTTP/1.1" 400 0
"""
answer = ["обход каталогов", "path traversal", "directory traversal"]
hint = "Обрати внимание на ../ в параметре."
explain = "../ поднимается из каталога загрузок к /etc/passwd — обход каталогов; сервер ответил 400."

[[item]]
id = "web-t1"
objective = "web"
role = "test7"
kind = "number"
prompt = "Сколько запросов закончились ошибкой клиента (коды 4xx)?"
