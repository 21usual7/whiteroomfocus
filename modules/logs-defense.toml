# Модуль: разбор синтетических журналов (защита). Все адреса — из документационных диапазонов
# 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24; журналы выдуманы.
# role = "practice" — для сессий; role = "test7" — недельная проверка: новые сопоставимые задачи
# на тот же навык, до проверки не показываются ни в одной группе.
# kind = "number": ответ — число; kind = "text": без учёта регистра и пробелов.
# Правка формулировки или ответа → увеличить v.

id = "logs-defense"
title = "Разбор журналов: вход по SSH и веб-сервер"

[[objective]]
id = "auth"
title = "Журнал входа SSH: неудачные попытки, перебор, вход после перебора"

[[objective]]
id = "web"
title = "Журнал веб-сервера: коды ответа, сканирование, обход каталогов"

# ───────────── auth ─────────────

[[item]]
id = "auth-p1"
objective = "auth"
role = "practice"
kind = "number"
prompt = "Сколько неудачных попыток входа в этом журнале?"
code = """
Nov 18 10:01:02 srv sshd[812]: Failed password for root from 203.0.113.7 port 50122 ssh2
Nov 18 10:01:04 srv sshd[812]: Failed password for root from 203.0.113.7 port 50124 ssh2
Nov 18 10:01:09 srv sshd[815]: Accepted publickey for anna from 192.0.2.10 port 41000 ssh2
Nov 18 10:01:11 srv sshd[812]: Failed password for admin from 203.0.113.7 port 50130 ssh2
"""
answer = ["3"]
hint = "Считай строки «Failed password», «Accepted» — успешный вход."
explain = "Три строки Failed password; Accepted publickey — успешный вход по ключу."

[[item]]
id = "auth-p2"
objective = "auth"
role = "practice"
kind = "text"
prompt = "С какого адреса идёт перебор паролей?"
code = """
Nov 18 10:30:00 srv sshd[840]: Accepted publickey for anna from 192.0.2.10 port 41200 ssh2
Nov 18 10:30:05 srv sshd[841]: Failed password for root from 198.51.100.14 port 5001 ssh2
Nov 18 10:30:06 srv sshd[841]: Failed password for admin from 198.51.100.14 port 5003 ssh2
Nov 18 10:30:08 srv sshd[841]: Failed password for test from 198.51.100.14 port 5005 ssh2
"""
answer = ["198.51.100.14"]
hint = "Ищи адрес, с которого подряд идут Failed password под разными именами."
explain = "198.51.100.14 перебирает root, admin, test — типичный подбор учётных записей."

[[item]]
id = "auth-p3"
objective = "auth"
role = "practice"
kind = "text"
prompt = "Под какой учётной записью был успешный вход после серии неудач с того же адреса?"
code = """
Nov 18 11:20:01 srv sshd[901]: Failed password for invalid user test from 198.51.100.23 port 6001 ssh2
Nov 18 11:20:03 srv sshd[901]: Failed password for invalid user oracle from 198.51.100.23 port 6003 ssh2
Nov 18 11:20:06 srv sshd[903]: Accepted password for deploy from 198.51.100.23 port 6010 ssh2
"""
answer = ["deploy"]
hint = "Найди строку Accepted с тем же адресом, что и у неудач."
explain = "Вход deploy с адреса, который только что перебирал имена, — повод сменить пароль и проверить сессию."

[[item]]
