Шаг 3 дан: много 404 к разным служебным путям — сканирование."""
code = """
203.0.113.99 - - [04/Mar/2026:09:10:01] "GET /phpmyadmin HTTP/1.1" 404 153
203.0.113.99 - - [04/Mar/2026:09:10:01] "GET /.git/config HTTP/1.1" 404 153
192.0.2.31 - - [04/Mar/2026:09:10:02] "GET /old-page HTTP/1.1" 404 153
203.0.113.99 - - [04/Mar/2026:09:10:02] "GET /admin.php HTTP/1.1" 404 153
"""
answer = ["3"]
hint = "Адрес стоит в начале строки."
explain = "Три 404 к /phpmyadmin, /.git/config и /admin.php за секунду — сканирование служебных путей."

