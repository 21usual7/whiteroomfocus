# ───────────── logs-web ─────────────

[[item]]
id = "logs-web-p1"
objective = "logs-web"
role = "practice"
kind = "text"
prompt = """Разобранный пример. Задача: найти сканирование путей в журнале nginx.
Шаг 1. Оставляем ответы 404 — запросы к несуществующим путям.
Шаг 2. Считаем их по адресу: 198.51.100.77 — 4, 192.0.2.15 — 1.
Шаг 3. Много 404 к служебным путям с одного адреса — сканирование.
Проверь себя: какой код ответа в примере выдаёт сканирование?"""
code = """
198.51.100.77 - - [03/Mar/2026:10:00:01] "GET /admin HTTP/1.1" 404 153
198.51.100.77 - - [03/Mar/2026:10:00:01] "GET /.env HTTP/1.1" 404 153
192.0.2.15 - - [03/Mar/2026:10:00:02] "GET /favicon.ico HTTP/1.1" 404 153
198.51.100.77 - - [03/Mar/2026:10:00:02] "GET /wp-login.php HTTP/1.1" 404 153
198.51.100.77 - - [03/Mar/2026:10:00:03] "GET /backup.zip HTTP/1.1" 404 153
192.0.2.15 - - [03/Mar/2026:10:00:04] "GET /index.html HTTP/1.1" 200 5120
"""
answer = ["404"]
hint = "Код записан в шаге 1 разбора."
explain = "Сканер перебирает типичные пути вслепую, поэтому получает 404. Один 404 на favicon.ico у обычного посетителя — шум."

[[item]]
id = "logs-web-p2"
