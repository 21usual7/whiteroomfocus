# Модуль: анализ синтетических журналов (защитная сторона). Адреса — из документационных сетей RFC 5737.
# Маршрут внутри каждой цели (порядок item = порядок выдачи):
#   p1 — разобранный пример для новичка (вопрос проверяет, что пример прочитан);
#   p2 — тот же метод с пропущенным шагом: один шаг делает ученик;
#   p3 — самостоятельная задача без опор;
#   p4 — самообъяснение ключевого шага (выбор варианта, проверяется локально, не моделью);
#   p5 — новая сопоставимая задача после разбора.
# Цель logs-method смешивает типы задач: ученик сам выбирает признак (подбор пароля или сканирование).
# role = "test7" — невиданные задачи недельной проверки. Журнал задачи — в code (показывается блоком).
# Ключи проверяет tests/review.rs: число = строки журнала с признаком и адресом из условия.
# Правка формулировки или ответа → увеличить v.

id = "log-analysis"
title = "Анализ журналов: подбор пароля и сканирование"

[[objective]]
id = "logs-auth"
title = "Журнал входа: подбор пароля"

[[objective]]
id = "logs-web"
title = "Журнал веб-сервера: сканирование путей"

[[objective]]
id = "logs-method"
title = "Выбор метода: какой признак искать в журнале"

# ───────────── logs-auth ─────────────

[[item]]
id = "logs-auth-p1"
objective = "logs-auth"
role = "practice"
kind = "text"
prompt = """Разобранный пример. Задача: найти источник подбора пароля в журнале sshd.
Шаг 1. Оставляем строки «Failed password».
Шаг 2. Считаем их по адресу: 203.0.113.7 — 4, 192.0.2.10 — 1.
Шаг 3. Подбор — много неудач с одного адреса за короткое время.
Проверь себя: какой адрес в примере — источник подбора пароля?"""
code = """
Mar 03 10:00:01 sshd: Failed password for root from 203.0.113.7
Mar 03 10:00:03 sshd: Failed password for admin from 203.0.113.7
Mar 03 10:00:04 sshd: Failed password for alice from 192.0.2.10
Mar 03 10:00:05 sshd: Failed password for test from 203.0.113.7
Mar 03 10:00:07 sshd: Failed password for root from 203.0.113.7
Mar 03 10:01:12 sshd: Accepted password for alice from 192.0.2.10
"""
answer = ["203.0.113.7"]
hint = "Ответ записан в шаге 2 и 3 разбора."
explain = "Четыре неудачи за шесть секунд к разным учётным записям — подбор. Одна ошибка alice с последующим входом — обычная опечатка."

[[item]]
id = "logs-auth-p2"
objective = "logs-auth"
role = "practice"
kind = "number"
prompt = """Пример с пропущенным шагом.
Шаг 1 сделан: ниже только строки «Failed password».
Шаг 2 — твой: сколько неудачных входов с 198.51.100.23?
Шаг 3 дан: больше трёх неудач с одного адреса за минуту — подбор."""
code = """
10:20:01 sshd: Failed password for root from 198.51.100.23
10:20:02 sshd: Failed password for root from 198.51.100.23
10:20:02 sshd: Failed password for bob from 192.0.2.44
10:20:04 sshd: Failed password for user from 198.51.100.23
10:20:05 sshd: Failed password for admin from 198.51.100.23
10:20:09 sshd: Failed password for oracle from 198.51.100.23
"""
answer = ["5"]
hint = "Считай только строки с этим адресом в конце."
explain = "Пять неудач за восемь секунд: по шагу 3 это подбор. Строка bob с другого адреса в счёт не входит."

