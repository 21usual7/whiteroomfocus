# ───────────── logs-method: смешанные задачи, нужно выбрать признак ─────────────

[[item]]
id = "logs-method-p1"
objective = "logs-method"
role = "practice"
kind = "text"
prompt = """Учётные записи сотрудников блокируются после неверных паролей, хотя сами они не входили. Что ищешь первым?
1) строки «Failed password» и счёт по адресу
2) ответы 404 и счёт по адресу
3) самые большие ответы по размеру
Ответь номером."""
answer = ["1"]
explain = "Блокировка после неверных паролей указывает на подбор: нужен журнал входа и неудачи по источнику."

