# Модуль: чтение, трассировка и отладка Python. Задания code запускаются в песочнице WHITE ROOM
# (bubblewrap + systemd: без сети, лимиты памяти, процессов и времени). Если песочница недоступна,
# задания code засчитываются как неверные — остаются чтение и трассировка (number, text).
id = "code-python"
title = "Python: трассировка, отладка, маленькие функции"
domain = "code"

[[objective]]
id = "code-trace"
title = "Трассировка циклов и списков"

[[objective]]
id = "code-debug"
title = "Отладка логической ошибки"
needs = ["code-trace"]

[[item]]
id = "code-trace-d1"
objective = "code-trace"
role = "diag"
kind = "number"
prompt = "Диагностика. Что напечатает код?"
code = """
s = 0
for i in range(1, 5):
    s += i
print(s)
"""
answer = ["10"]
explain = "range(1, 5) — это 1, 2, 3, 4; сумма 10."

