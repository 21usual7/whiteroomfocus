[[item]]
id = "code-debug-p2"
objective = "code-debug"
role = "practice"
stage = "faded"
kind = "code"
prompt = """Пример с пропуском. Ошибка уже найдена: функция должна вернуть число чётных, но считает нечётные.
Твой шаг — исправь функцию count_even(a) и пришли её целиком."""
code = """
def count_even(a):
    return sum(1 for v in a if v % 2 == 1)
"""
answer = ["def count_even(a):\n    return sum(1 for v in a if v % 2 == 0)"]
tests = """
assert count_even([1, 2, 4, 7]) == 2
assert count_even([]) == 0
assert count_even([-2, 3]) == 1
"""
hint = "Остаток от деления на 2 у чётного числа — 0."
explain = "Условие v % 2 == 0."

[[item]]
id = "code-debug-p3"
objective = "code-debug"
role = "practice"
stage = "solo"
kind = "code"
prompt = "Самостоятельно: напиши last_index(a, x) — индекс последнего вхождения x в список a или -1."
answer = ["def last_index(a, x):\n    for i in range(len(a) - 1, -1, -1):\n        if a[i] == x:\n            return i\n    return -1"]
tests = """
assert last_index([1, 2, 1], 1) == 2
assert last_index([], 5) == -1
assert last_index([5], 5) == 0
assert last_index([1, 2], 3) == -1
"""
explain = "Идём с конца; пустой список и отсутствие x — граничные случаи."

