# Модуль: работа с источниками. Тексты — modules/sources/research-texts.md (фрагменты A, B, C);
# source у задания указывает на заголовок фрагмента. Тезис своими словами — explain с рубрикой.
id = "research-sources"
title = "Источники: чтение по частям, тезис, сопоставление"
domain = "research"

[[objective]]
id = "rs-read"
title = "Чтение фрагмента и тезис своими словами"

[[objective]]
id = "rs-compare"
title = "Сопоставление источников и границы вывода"
needs = ["rs-read"]

[[item]]
id = "rs-read-d1"
objective = "rs-read"
role = "diag"
kind = "text"
prompt = "Диагностика. Во фрагменте A: какая группа помнила больше через неделю — «перечитывание» или «припоминание»?"
source = "modules/sources/research-texts.md#фрагмент-a--эффект-тестирования"
answer = ["припоминание"]
explain = "Через неделю лучше помнила группа, писавшая по памяти."

[[item]]
id = "rs-read-p1"
objective = "rs-read"
role = "practice"
stage = "worked"
kind = "text"
prompt = """Разобранный пример (фрагмент A).
Шаг 1. Что сравнивали: перечитывание и припоминание по памяти.
Шаг 2. Что измеряли и когда: сколько помнят через 5 минут и через неделю.
Шаг 3. Результат: через 5 минут чуть лучше перечитывание, через неделю — припоминание.
Проверь себя: через сколько времени перечитывание давало лучший результат? (ответ: число и единица)"""
source = "modules/sources/research-texts.md#фрагмент-a--эффект-тестирования"
answer = ["5 минут", "пять минут", "5 мин"]
hint = "Шаг 3."
explain = "Краткосрочный и долгосрочный результат расходятся — поэтому важен срок проверки."

[[item]]
id = "rs-read-p2"
objective = "rs-read"
role = "practice"
stage = "faded"
kind = "text"
prompt = """С пропуском (фрагмент B).
Шаг 1 сделан: сравнивают разнесённые и сплошные занятия того же объёма.
Шаг 2 — твой: какие занятия дают лучшее долговременное запоминание — «разнесённые» или «сплошные»?"""
source = "modules/sources/research-texts.md#фрагмент-b--интервальное-повторение"
answer = ["разнесённые", "разнесенные"]
explain = "Распределённая практика выигрывает в среднем по обзору."

[[item]]
id = "rs-read-p3"
objective = "rs-read"
role = "practice"
stage = "explain"
kind = "explain"
prompt = "Сформулируй тезис фрагмента A своими словами одним предложением, без слов «тестирование» и «эффект»."
source = "modules/sources/research-texts.md#фрагмент-a--эффект-тестирования"
answer = ["Если после чтения попытаться вспомнить текст, через неделю помнишь больше, чем если просто перечитать."]
rubric = "1) есть оба условия (вспоминать / перечитывать); 2) указан долгий срок; 3) нет выдуманных деталей, которых нет во фрагменте."
explain = "Тезис = что сравнивали + что вышло + при каком сроке."

[[item]]
id = "rs-read-p4"
objective = "rs-read"
role = "practice"
stage = "solo"
kind = "card"
prompt = "Утверждение и источник: «Наилучший промежуток между занятиями растёт со сроком, к которому нужно помнить». Какой источник?"
source = "modules/sources/research-texts.md#фрагмент-b--интервальное-повторение"
answer = ["Cepeda и др., 2006, Psychological Bulletin"]
rubric = "Автор и год — «вспомнил»; только тема обзора — «с трудом»."
explain = "Фрагмент B."

[[item]]
id = "rs-read-p5"
objective = "rs-read"
role = "practice"
stage = "transfer"
kind = "text"
prompt = "Перенос: во фрагменте A что делала группа с лучшим результатом через неделю — одним словом-глаголом в инфинитиве?"
source = "modules/sources/research-texts.md#фрагмент-a--эффект-тестирования"
answer = ["вспоминать", "припоминать", "писать"]
explain = "Писали по памяти, то есть вспоминали."

[[item]]
id = "rs-read-t1"
objective = "rs-read"
role = "test7"
kind = "text"
prompt = "Фрагмент B: что растёт вместе со сроком, к которому нужно помнить материал? (два слова: «наилучший …»)"
source = "modules/sources/research-texts.md#фрагмент-b--интервальное-повторение"
answer = ["наилучший промежуток", "промежуток"]
explain = "Наилучший промежуток между занятиями."

[[item]]
id = "rs-read-t2"
objective = "rs-read"
role = "test7"
kind = "number"
prompt = "Фрагмент A: в каком году опубликована работа Roediger и Karpicke?"
source = "modules/sources/research-texts.md#фрагмент-a--эффект-тестирования"
answer = ["2006"]
explain = "2006."

[[item]]
id = "rs-compare-d1"
objective = "rs-compare"
role = "diag"
kind = "text"
prompt = "Диагностика. Какой фрагмент говорит об ограничениях выводов — A, B или C?"
source = "modules/sources/research-texts.md#фрагмент-c--ограничение"
answer = ["C"]
explain = "Фрагмент C."

[[item]]
id = "rs-compare-p1"
objective = "rs-compare"
role = "practice"
stage = "worked"
kind = "text"
prompt = """Разобранный пример. Сопоставляем A и B.
Общее: оба про долговременную память и сравнивают два способа учиться.
Различие: A — одно исследование про припоминание, B — обзор многих исследований про интервалы.
Проверь себя: какой из двух — обзор многих исследований?"""
answer = ["B"]
hint = "Строка «Различие»."
explain = "Обзор обобщает, отдельный эксперимент — частный случай."

[[item]]
id = "rs-compare-p2"
objective = "rs-compare"
role = "practice"
stage = "faded"
kind = "text"
prompt = """С пропуском. Вопрос: можно ли по A и B утверждать, что так же учатся сложные навыки, например программирование?
Шаг 1 сделан: A и B — про тексты, слова и факты.
Шаг 2 — твой: какой фрагмент прямо ограничивает такой перенос? (буква)"""
source = "modules/sources/research-texts.md#фрагмент-c--ограничение"
answer = ["C"]
explain = "C: для сложных навыков данных меньше."

[[item]]
id = "rs-compare-p3"
objective = "rs-compare"
role = "practice"
stage = "explain"
kind = "explain"
prompt = "Сопоставь A и B в двух предложениях: что их объединяет и чем отличается сила доказательства."
answer = ["Оба показывают, что способ занятий влияет на долгую память. A — один эксперимент, B — обзор многих, поэтому вывод B опирается на больше данных."]
rubric = "1) общее названо; 2) различие типа источника (эксперимент / обзор); 3) вывод о силе доказательства без преувеличения."
explain = "Тип источника — часть оценки утверждения."

[[item]]
id = "rs-compare-p4"
objective = "rs-compare"
role = "practice"
stage = "solo"
kind = "text"
prompt = "Самостоятельно: утверждение «интервалы помогают всем навыкам одинаково» — подтверждено фрагментами? (да или нет)"
answer = ["нет"]
explain = "Фрагмент C прямо ограничивает такой вывод."

[[item]]
id = "rs-compare-p5"
objective = "rs-compare"
role = "practice"
stage = "transfer"
kind = "text"
prompt = "Перенос: тебе встретилось «учёные доказали, что перечитывание бесполезно». Какой фрагмент это опровергает тем, что через 5 минут перечитывание было лучше? (буква)"
answer = ["A"]
explain = "A: перечитывание не бесполезно — оно проигрывает на долгом сроке."

[[item]]
id = "rs-compare-t1"
objective = "rs-compare"
role = "test7"
kind = "text"
prompt = "Утверждение: «результаты лабораторных опытов на словах можно без оговорок переносить на сложные навыки». Подтверждено фрагментами? (да или нет)"
answer = ["нет"]
explain = "C требует осторожности."

[[item]]
id = "rs-compare-t2"
objective = "rs-compare"
role = "test7"
kind = "text"
prompt = "Какой из фрагментов A и B опирается на больше исследований? (буква)"
answer = ["B"]
explain = "B — обзор."
